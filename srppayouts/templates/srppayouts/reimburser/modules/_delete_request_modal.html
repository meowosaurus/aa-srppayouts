{% load i18n %}
{% load humanize %}

<div class="modal" tabindex="-1" id="deleteOpenRequest{{ request.killmail_id }}">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">
            <img src="https://image.eveonline.com/types/{{ request.ship_id }}/icon?size=32" width="25px" class="img-fluid rounded" style="margin-right: 0.1rem;">
            <div style="display: inline-block; vertical-align:middle;">
                <b>{{ request.ship_name }}</b>
                lost in 
                <b>{{ request.system_name }}</b>
            </div>
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            Are you sure you want to delete this request? 
        </div>
        <div class="modal-footer d-flex justify-content-between">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                <i class="fa-solid fa-xmark"></i>
                Close
            </button>
            <button type="button" class="btn btn-danger">
                <i class="fa-solid fa-clipboard-check"></i>
                Delete
            </button>
        </div>
      </div>
    </div>
</div>
